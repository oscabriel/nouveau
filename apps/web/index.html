<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nouveau | Don't miss your next cup.</title>
		<meta
			name="description"
			content="Nouveau watches specialty roasters' shops around the clock and tells you when a new lot lands, a sold-out one comes back, or a price drops."
		/>
		<!--
			Static share card for the whole app. Link crawlers do not run the
			SPA, so these tags are the only ones they read; every route shares
			them. The image is the owner's export at apps/web/public/og.png,
			1200x630, and the absolute URL is what crawlers require.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Nouveau" />
		<meta property="og:title" content="Nouveau" />
		<meta
			property="og:description"
			content="Never forget your favorite cup or miss the next big drop."
		/>
		<meta property="og:url" content="https://nouveau.coffee/" />
		<meta property="og:image" content="https://nouveau.coffee/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The NOUVEAU wordmark with a branch of Coffea arabica threaded through the V"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Nouveau" />
		<meta
			name="twitter:description"
			content="Never forget your favorite cup or miss the next big drop."
		/>
		<meta name="twitter:image" content="https://nouveau.coffee/og.png" />
		<link href="/favicon.ico" rel="icon" sizes="32x32" />
		<link href="/favicon-32.png" rel="icon" sizes="32x32" type="image/png" />
		<link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
